name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Estilo
        run: ruff check src tests

      # Solo T0-T2. Las pruebas marcadas "rehearsal" tocan el servidor real de
      # la UNED y son un acto deliberado del profesor, nunca algo automatico.
      - name: Pruebas
        run: pytest -q -m "not rehearsal"
