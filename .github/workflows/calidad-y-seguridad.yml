name: Calidad y seguridad

# Activa en este repositorio los dos flujos reutilizables y genéricos que
# viven en security-checks.yml y quality-checks.yml. Ese es el punto de
# tenerlos como flujos reutilizables en vez de pasos sueltos aquí mismo:
# cualquier otro repositorio de chhdeza puede apuntar a estos dos archivos
# con `uses: chhdeza/moodleToNotas-sync/.github/workflows/<archivo>@main`
# y obtener las mismas revisiones sin copiar y pegar nada. Ver el
# encabezado de cada uno de esos archivos para el ejemplo completo.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seguridad:
    name: Seguridad
    permissions:
      contents: read
    uses: ./.github/workflows/security-checks.yml

  calidad:
    name: Calidad
    permissions:
      contents: read
    uses: ./.github/workflows/quality-checks.yml
    with:
      # Repositorio existente con historia propia: revisar TODO el árbol
      # desde ya ahogaría el primer PR en hallazgos viejos que nadie pidió
      # resolver hoy. Se revisa solo lo que cambia.
      validate-all: false
