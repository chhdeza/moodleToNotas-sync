name: Sincronizar notas

# Corre sola los lunes y sube las notas nuevas. También se puede lanzar a mano
# desde la pestaña "Actions" (botón "Run workflow"), que es lo recomendable la
# primera vez: dejá "commit" en false y mirá el resumen antes de habilitar nada.
on:
  schedule:
    # Lunes 05:00 en Costa Rica. El servidor de GitHub usa UTC y Costa Rica está
    # siempre en UTC-6 (no cambia con el horario de verano), así que son las 11:00.
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      course:
        description: "id del curso en courses.yml (vacío = todos)"
        required: false
        type: string
      group:
        description: "Limitar a un grupo de Moodle (vacío = todos)"
        required: false
        type: string
      commit:
        description: "Escribir de verdad en Notas Parciales"
        required: true
        type: boolean
        default: false
      allow_update:
        description: "Permitir cambiar notas que ya estaban puestas"
        required: true
        type: boolean
        default: false

# Nunca dos corridas escribiendo a la vez: ni la programada contra una
# manual, ni dos manuales entre sí.
concurrency:
  group: mnsync-escritura
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # para avisar cuando algo necesita atención

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Traer el repositorio (con el submódulo)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Revisar la configuración
        run: mnsync doctor --offline

      - name: Sincronizar
        id: sync
        env:
          MOODLE_URL: ${{ secrets.MOODLE_URL }}
          MOODLE_USERNAME: ${{ secrets.MOODLE_USERNAME }}
          MOODLE_PASSWORD: ${{ secrets.MOODLE_PASSWORD }}
          NP_NTLM_USER: ${{ secrets.NP_NTLM_USER }}
          NP_NTLM_PASSWORD: ${{ secrets.NP_NTLM_PASSWORD }}
        run: |
          set -o pipefail

          # La corrida programada escribe; la manual, solo si se lo pidieron.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            COMMIT="--commit"
          elif [ "${{ inputs.commit }}" = "true" ]; then
            COMMIT="--commit"
          else
            COMMIT=""
          fi

          EXTRA=""
          [ "${{ inputs.allow_update }}" = "true" ] && EXTRA="$EXTRA --allow-update"
          [ -n "${{ inputs.group }}" ] && EXTRA="$EXTRA --group ${{ inputs.group }}"

          # Cursos a procesar: el indicado, o todos los de courses.yml.
          if [ -n "${{ inputs.course }}" ]; then
            CURSOS="${{ inputs.course }}"
          else
            CURSOS=$(python -c "
          import yaml
          print(' '.join(c['id'] for c in yaml.safe_load(open('courses.yml'))['courses']))
          ")
          fi

          PEOR=0
          for curso in $CURSOS; do
            echo "::group::Curso $curso"
            set +e
            mnsync sync --course "$curso" $COMMIT $EXTRA
            CODIGO=$?
            set -e
            echo "::endgroup::"
            [ $CODIGO -gt $PEOR ] && PEOR=$CODIGO
          done

          echo "codigo=$PEOR" >> "$GITHUB_OUTPUT"
          # 2 = un freno detuvo un grupo. No es un fallo del programa: es el
          # programa haciendo su trabajo. Se avisa, pero no se marca en rojo.
          [ $PEOR -le 2 ] && exit 0 || exit $PEOR

      - name: Publicar el reporte en el resumen de la corrida
        if: always()
        run: |
          {
            echo "# Sincronización de notas"
            echo
            for f in salida/reporte_*.md; do
              [ -e "$f" ] || continue
              # Se saltan los encabezados de nivel 1 para no romper el resumen.
              sed 's/^# /## /' "$f"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar los archivos de la corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sincronizacion-${{ github.run_number }}
          path: |
            salida/*.md
            salida/*.csv
          # Estos archivos llevan cédulas, nombres y notas de estudiantes.
          # Se conservan poco tiempo a propósito.
          retention-days: 7
          if-no-files-found: warn

      - name: Avisar si algo necesita atención
        if: always() && (steps.sync.outputs.codigo != '0' || failure())
        uses: actions/github-script@v7
        with:
          script: |
            const codigo = '${{ steps.sync.outputs.codigo }}';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;

            const titulo = codigo === '2'
              ? 'Sincronización detenida por un freno de seguridad'
              : 'La sincronización de notas falló';

            const cuerpo = [
              codigo === '2'
                ? 'Un freno de seguridad detuvo al menos un grupo. **No se escribió nada** en ese grupo.'
                : 'La sincronización terminó con error.',
              '',
              `Mirá el detalle acá: ${url}`,
              '',
              'El resumen de la corrida tiene el reporte completo, y en los',
              '"Artifacts" está el plan para abrir en Excel.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${titulo} (corrida #${context.runNumber})`,
              body: cuerpo,
            });
