version: 2

# Todas las acciones de los flujos van fijadas por hash. Eso protege contra
# que un tag se reapunte a otro commit, pero tiene un costo: un hash no se
# mueve nunca, ni siquiera cuando la versión a la que apunta resulta tener
# una vulnerabilidad.
#
# Dependabot cubre justo ese hueco. Entiende el formato
# `accion@<hash> # vX.Y.Z`: actualiza el hash y el comentario a la vez, y
# abre un PR que CI verifica antes de que nadie lo mergee.
#
# Fijar sin un mecanismo de actualización no es más seguro: solo cambia una
# vulnerabilidad rápida por una lenta.

updates:
  # ─── Acciones de GitHub ────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      # Semanal, no mensual. Mensual significa que una version con una
      # vulnerabilidad puede quedarse fijada hasta 30 dias. Los avisos de
      # seguridad se saltan el calendario igual, pero el resto de las
      # actualizaciones no, y son justo las que evitan llegar tarde.
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencias
      - seguridad
    groups:
      # Un solo PR por semana con todas las acciones, en vez de cinco
      # sueltos. Son pocas y se revisan mejor juntas: un vistazo a la
      # tabla de hashes y listo.
      acciones:
        patterns:
          - "*"

  # ─── Dependencias de Python (pyproject.toml + uv.lock) ─────────────────
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencias
    groups:
      # Las actualizaciones de parche llegan juntas en un solo PR: son las
      # menos riesgosas y no vale la pena revisarlas de a una.
      parches:
        update-types:
          - patch

  # ─── El submódulo grade-uploader ───────────────────────────────────────
  # Avisa cuando el repositorio original avanza, para que el pin no se quede
  # atrás en silencio.
  #
  # Semanal, por el mismo motivo que las acciones, y con un caso real
  # detrás: el submódulo quitó de sus ejemplos una cédula verdadera, y acá
  # el puntero siguió señalando el commit anterior. Nada en el diff de este
  # repositorio estaba mal —lo que dejó de ser cierto fue un hash— así que
  # ninguna revisión lo iba a encontrar. Quien clonara mientras tanto se
  # llevaba el dato personal igual.
  #
  # Un puntero viejo no es solo una versión atrasada: puede ser un arreglo
  # que ya existe y que nadie está recibiendo.
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    labels:
      - dependencias
