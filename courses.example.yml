# ╔══════════════════════════════════════════════════════════════════╗
# ║  courses.yml — qué cursos sincronizar y hacia dónde              ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# Este archivo NO lleva contraseñas ni cédulas: solo códigos.
# Tu cédula (la del tutor) va en el .env, como NP_TUTOR.
# Las credenciales van en el archivo .env, aparte.
#
# ¿No sabés qué poner en "groups"? Ejecutá:
#     mnsync groups --course <id-del-curso>
# y el programa te muestra los grupos con sus números.

courses:
  # "id" es un apodo que elegís vos. Se usa para nombrar archivos y
  # para el comando:  mnsync sync --course redes-2026-3
  - id: redes-2026-3

    moodle:
      # De la URL de tu curso en Moodle:
      #   .../course/view.php?id=8067   →   course_id: 8067
      course_id: 8067

      # ─── LOS GRUPOS QUE DAS VOS ─────────────────────────────────
      #
      # Un curso de Moodle se reparte en grupos entre los varios
      # profesores que dan la asignatura. Acá van los tuyos, y solo
      # los tuyos: el resto son estudiantes de otros profesores.
      #
      # No hay que decir a qué centro universitario van. Un grupo
      # tuyo reúne estudiantes de muchos centros a la vez, y el
      # programa averigua solo a dónde corresponde cada uno.
      groups:
        - id: 38525
          name: "Grupo 1"     # solo para los reportes
        - id: 38526
          name: "Grupo 2"

    # Estos valores son los MISMOS para todo el curso.
    # Salen de los menús desplegables de la página de Captura de Notas.
    notas_parciales:
      ano: "2026"              # Año
      pac: "3"                 # Período (cuatrimestre)
      tipo: "O"                # O = Ordinaria (lo normal)
      asignatura: "00883"      # Sigla del curso
      escuela: "03"            # Escuela
      catedra: 253             # Cátedra
      encargado: ARODRIGUEZP   # Usuario del encargado de cátedra
      modelo: 4                # Modelo de evaluación

    # ─── Opcional: los grupos de Notas Parciales ──────────────────
    #
    # Si NO ponés esta sección, la primera corrida los averigua sola
    # y tarda un poco más. Si la ponés, va directo.
    #
    # Fijate que un mismo centro universitario puede aparecer varias
    # veces con grupos distintos: eso es normal. Los estudiantes de
    # un centro no siempre están todos en el mismo grupo.
    #
    # destinos:
    #   - cu: "42"       # Desamparados, grupo 1
    #     grupo: 1
    #   - cu: "42"       # Desamparados, grupo 2 — el MISMO centro
    #     grupo: 2
    #   - cu: "01"       # San José
    #     grupo: 1

    # ─── Opcional: emparejar columnas a mano ──────────────────────
    # Normalmente el programa empareja solo la columna de Moodle con
    # el instrumento de Notas Parciales. Si alguna no la reconoce, la
    # nombrás acá.
    # item_map:
    #   "Tarea 1 (Real)": Tar1
    #   "Proyecto Final (Real)": Proy1

    # ─── Reglas de seguridad de este curso ────────────────────────
    policy:
      # ¿Puede CAMBIAR una nota que ya está puesta en el sistema?
      # false = no la toca, solo la reporta (recomendado).
      allow_update: false

      # Si allow_update es true, con qué código se justifica el cambio.
      # 2005 = "Error de digitación".
      justificacion_codigo: 2005

      # Freno de seguridad: si una corrida fuera a cambiar MÁS de esta
      # cantidad de notas EN UN MISMO grupo de Notas Parciales, se
      # detiene y te avisa en vez de escribir. Protege contra un error
      # grande hecho de un solo golpe. Poné 0 para quitar el freno.
      max_changes: 40
